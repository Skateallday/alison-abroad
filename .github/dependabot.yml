version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"

    open-pull-requests-limit: 5

    commit-message:
      prefix: "chore(deps)"

    labels:
      - "dependencies"

    assignees:
      - "Skateallday"

    reviewers:
      - "Skateallday"

    rebase-strategy: "auto"
    versioning-strategy: "increase"

    groups:
      production-deps:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

      dev-deps:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

      majors:
        update-types:
          - "major"
